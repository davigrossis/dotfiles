# Gerado pelo matugen (apply-theme.sh) — cores do wallpaper atual. Não edite à mão.
# Só é carregado no Hyprland (via "envinclude KITTY_RICE_*" no kitty.conf).

foreground              {{ colors.on_surface.default.hex }}
background              {{ colors.surface.default.hex }}
