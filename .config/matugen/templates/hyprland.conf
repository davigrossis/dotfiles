# Gerado pelo matugen (apply-theme.sh) a partir do wallpaper — não edite à mão.
# Carregado por ~/.config/hypr/rice/rice.conf (apenas no modo Quickshell).

$rice_primary = rgb({{ colors.primary.default.hex_stripped }})
$rice_secondary = rgb({{ colors.secondary.default.hex_stripped }})
$rice_tertiary = rgb({{ colors.tertiary.default.hex_stripped }})
$rice_surface = rgb({{ colors.surface.default.hex_stripped }})
$rice_outline = rgb({{ colors.outline_variant.default.hex_stripped }})

general {
    col.active_border = rgba({{ colors.primary.default.hex_stripped }}ee) rgba({{ colors.tertiary.default.hex_stripped }}ee) 45deg
    col.inactive_border = rgba({{ colors.outline_variant.default.hex_stripped }}aa)
}

decoration {
    shadow {
        color = rgba({{ colors.shadow.default.hex_stripped }}cc)
        color_inactive = rgba({{ colors.shadow.default.hex_stripped }}88)
    }
}
