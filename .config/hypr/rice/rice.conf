# ─────────────────────────────────────────────────────────────────────────────
#  Rice Quickshell — carregado por ~/.config/hypr/rice/session.conf (modo "quickshell").
#  Vale SOMENTE para a sessão Hyprland; nada daqui é lido pelo KDE Plasma.
#  Rollback para a Waybar: ~/.config/scripts/rice-mode.sh waybar
# ─────────────────────────────────────────────────────────────────────────────

# Cores do wallpaper (bordas/sombras), geradas pelo matugen via apply-theme.sh.
# O apply-theme.sh também aplica ao vivo com "hyprctl keyword" (sem hyprctl reload).
source = ~/.local/state/rice/hyprland-colors.conf

# Blur/transparência das layers do Quickshell e do rofi
source = ~/.config/hypr/rice/layerrules.conf

# ── Ambiente (só nesta sessão — nunca em /etc/environment, ~/.profile ou environment.d) ──
# GTK3: tema "Matugen" (adw-gtk3 + cores do wallpaper) em ~/.local/share/themes/Matugen.
#       GTK4 continua igual (Breeze-Dark), pois ~/.config/gtk-4.0 é compartilhado com o KDE.
env = GTK_THEME,Matugen
# kitty: o kitty.conf tem "envinclude KITTY_RICE_*" — só inclui as cores quando isto existe
env = KITTY_RICE_COLORS,include ~/.local/state/rice/kitty-colors.conf
# (os wrappers do rice em ~/.config/scripts/bin — waypaper consertado, btop com tema — são
#  colocados na frente do PATH pelo rice-session.sh com "hyprctl keyword env", de forma
#  idempotente; um "env = PATH,...:$PATH" aqui duplicaria a entrada a cada reload)
# "qs ipc call ..." sem precisar de "-c rice"
env = QS_CONFIG_NAME,rice
# (QT_QPA_PLATFORMTHEME=qt6ct já é definido no hyprland.conf; o qt6ct.conf aponta para o
#  esquema de cores gerado — veja apply-theme.sh)

# ── Autostart: wallpaper do Waypaper + Quickshell (substitui waybar/hyprpaper/dunst) ──
exec-once = ~/.config/scripts/rice-session.sh

# ── Atalhos NOVOS (nenhum atalho existente foi alterado) ──────────────────────────
bind = SUPER SHIFT, W, global, quickshell:wallpaper        # seletor de wallpapers
bind = SUPER, N, global, quickshell:notifications          # central de notificações
bind = SUPER, C, global, quickshell:control                # central de controle
bind = SUPER, Escape, global, quickshell:power             # menu de energia
bind = SUPER SHIFT, R, exec, ~/.config/scripts/rice-session.sh --restart-shell   # reinicia o Quickshell
