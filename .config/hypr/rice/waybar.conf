# ─────────────────────────────────────────────────────────────────────────────
#  Modo Waybar (fallback / rollback) — exatamente o autostart original do hyprland.conf.
#  Ativado por: ~/.config/scripts/rice-mode.sh waybar
# ─────────────────────────────────────────────────────────────────────────────
exec-once = waybar -c ~/.config/waybar/config-minimal.jsonc -s ~/.config/waybar/style-minimal.css &
exec-once = hyprpaper
bind = SUPER, W, exec, waypaper   # atalho original do Waypaper
