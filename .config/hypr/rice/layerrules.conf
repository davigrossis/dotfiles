# Regras de layer do rice (sintaxe do Hyprland 0.53+). Carregado por rice.conf.
# Blur/transparência coerentes com o blur do hyprland.conf: o Quickshell desenha fundos
# semitransparentes e o Hyprland borra o que está atrás. ignore_alpha evita borrar as
# áreas totalmente transparentes (cantos arredondados, sombras).

layerrule = blur on, match:namespace ^(rice-(bar|panel|notifications|osd|picker|dim))$
layerrule = ignore_alpha 0.35, match:namespace ^(rice-(bar|panel|notifications|osd|picker))$
layerrule = blur_popups on, match:namespace ^(rice-bar)$

# Launcher (rofi) com o mesmo blur dos painéis
layerrule = blur on, match:namespace ^(rofi)$
layerrule = ignore_alpha 0.35, match:namespace ^(rofi)$

# Animações de entrada/saída dos painéis ficam por conta do QML (mais suaves);
# o Hyprland só faz o fade.
layerrule = animation fade, match:namespace ^(rice-(panel|notifications|osd|picker|dim))$
